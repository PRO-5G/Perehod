<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0813">
  <title>GiftOops — запуск</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#0b0813;color:white}
    body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 40%,#281647 0,#0b0813 58%)}
    .wrap{width:min(390px,100%);text-align:center}.logo{width:96px;height:96px;margin:auto;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,#ab7bff,#5826ad);box-shadow:0 15px 55px #8451ff55;font-size:48px;animation:float 2.8s ease-in-out infinite}
    h1{margin:26px 0 5px;font-size:35px;letter-spacing:-1.9px;font-weight:850}h1 span{color:#b98aff}.sub{margin:0;color:#aaa0bd;font-size:13px;letter-spacing:1px}
    .progress{height:6px;background:#30253f;border-radius:20px;overflow:hidden;margin-top:45px}.bar{height:100%;width:0;background:linear-gradient(90deg,#8e56f7,#d1a9ff);border-radius:20px;animation:load 2.3s ease-out forwards}
    .status{margin:15px 0 0;font-size:13px;color:#bdb0d0}.hint{display:none;margin-top:24px;color:#b2a4c3;font-size:13px;line-height:1.5}.hint.show{display:block}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;margin-top:14px;padding:12px 24px;border-radius:13px;background:#9060ed;color:#fff;font-weight:700;text-decoration:none}
    footer{margin-top:52px;font-size:11px;color:#766a86;letter-spacing:2px}
    @keyframes load{to{width:100%}}@keyframes float{50%{transform:translateY(-7px)}}
    @media(prefers-reduced-motion:reduce){.logo{animation:none}.bar{animation:none;width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo" aria-hidden="true">🎁</div>
    <h1>GIFT<span>OOPS</span></h1>
    <p class="sub">ТВОЯ УДАЧА НАЧИНАЕТСЯ ЗДЕСЬ</p>
    <div class="progress" role="progressbar" aria-label="Загрузка"></div>
    <p class="status" id="status">Подключаемся к приложению…</p>
    <div class="hint" id="hint">
      Если переход не произошёл, нажми кнопку ниже.
      <div><a id="open" href="http://m1.nexuz.ru:25569/">Открыть GIFT OOPS</a></div>
    </div>
    <footer>ALPHA 0.0.1</footer>
  </main>
  <script>
    // Демонстрационный вариант: GitHub Pages не превращает HTTP-адрес в HTTPS.
    const destination = 'http://m1.nexuz.ru:25569/';
    const hint = document.getElementById('hint');
    const status = document.getElementById('status');
    document.getElementById('open').href = destination;
    setTimeout(() => {
      status.textContent = 'Открываем приложение…';
      hint.classList.add('show');
      try { window.location.assign(destination); } catch(e) { status.textContent = 'Автоматический переход заблокирован'; }
    }, 2400);
  </script>
</body>
</html>
